# Production setup. The migrations run on every start, then the queue worker
# and scheduler run alongside MySQL. The web interface (PHP-FPM behind nginx,
# served on your tailnet by Tailscale) only runs with the "web" profile, which
# COMPOSE_PROFILES=web in .env turns on.
name: bitwarden-auto-backups

x-app: &app
  build:
    context: .
    dockerfile: docker/production/Dockerfile
    target: app
  image: bitwarden-auto-backups-app
  # Built on this machine, so never look for it on Docker Hub.
  pull_policy: never
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *app
    command: ['php', 'artisan', 'migrate', '--force']
    restart: 'no'
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    <<: *app
    command: ['php', 'artisan', 'queue:work', '--sleep=3', '--max-time=3600']
    # A backup can run for up to 6 minutes. Give the worker time to finish it
    # when stopping, so the Bitwarden CLI always logs out and cleans up.
    stop_grace_period: 7m

  scheduler:
    <<: *app
    command: ['php', 'artisan', 'schedule:work']

  php-fpm:
    <<: *app
    profiles: [web]
    command: ['php-fpm']

  # Joins your tailnet as its own machine, and serves the web interface over
  # HTTPS at https://<TS_HOSTNAME>.<your tailnet>.ts.net. nginx shares its
  # network, so the web interface isn't published on the server itself.
  tailscale:
    image: tailscale/tailscale:stable
    profiles: [web]
    restart: unless-stopped
    environment:
      TS_AUTHKEY: '${TS_AUTHKEY:-}'
      TS_HOSTNAME: '${TS_HOSTNAME:-bitwarden-auto-backups}'
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: 'true'
    volumes:
      - tailscale:/var/lib/tailscale
      - ./docker/production/tailscale/serve.json:/config/serve.json:ro

  nginx:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: web
    image: bitwarden-auto-backups-web
    pull_policy: never
    profiles: [web]
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - php-fpm
      - tailscale

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', '${DB_USERNAME}', '-p${DB_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  storage:
  mysql-data:
  tailscale:
