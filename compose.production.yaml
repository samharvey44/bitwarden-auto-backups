# Production setup. The migrations run on every start, then the queue worker
# and scheduler run alongside MySQL. The web interface (PHP-FPM behind nginx)
# only runs with the "web" profile:
#
#   docker compose -f compose.production.yaml up -d
#   docker compose -f compose.production.yaml --profile web up -d
name: bitwarden-auto-backups

x-app: &app
  build:
    context: .
    dockerfile: docker/production/Dockerfile
    target: app
  image: bitwarden-auto-backups-app
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *app
    command: ['php', 'artisan', 'migrate', '--force']
    restart: 'no'
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    <<: *app
    command: ['php', 'artisan', 'queue:work', '--sleep=3', '--max-time=3600']
    # A backup can run for up to 6 minutes. Give the worker time to finish it
    # when stopping, so the Bitwarden CLI always logs out and cleans up.
    stop_grace_period: 7m

  scheduler:
    <<: *app
    command: ['php', 'artisan', 'schedule:work']

  php-fpm:
    <<: *app
    profiles: [web]
    command: ['php-fpm']

  nginx:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: web
    image: bitwarden-auto-backups-web
    profiles: [web]
    restart: unless-stopped
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    depends_on:
      - php-fpm

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', '${DB_USERNAME}', '-p${DB_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  storage:
  mysql-data:
